version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: hiresight-postgres
    environment:
      POSTGRES_DB: hiresight
      POSTGRES_USER: hiresight
      POSTGRES_PASSWORD: hiresight
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiresight -d hiresight"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: hiresight-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-gateway:
    build: ../services/api-gateway
    container_name: hiresight-api-gateway
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://hiresight:hiresight@postgres:5432/hiresight
      REDIS_URL: redis://redis:6379/0
      AUTH0_DOMAIN: dev-wt0zci4ynfbqzxos.us.auth0.com
      AUTH0_AUDIENCE: https://api.hiresight.local
      AUTH0_ISSUER: https://dev-wt0zci4ynfbqzxos.us.auth0.com/
      AUTH0_M2M_CLIENT_ID: D7DiNUsX84izLtt6MTNlmoMJpiUy80gv
      AUTH0_M2M_CLIENT_SECRET: sMIpiJxN2BAQKnXdCCaJR2IHX20DzlWV96wVda_NAqmeyiGg4acM7e0DUZb3xfOp
      AUTH0_ROLE_ID_CANDIDATE: rol_vS8bc4s2RWNTUbiF
      AUTH0_ROLE_ID_RECRUITER: rol_TRFGELaF2kzTUEIt
    volumes:
      - ../services/api-gateway:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


volumes:
  pg_data:
