name: Deploy CV Service to ECS Fargate

on:
  push:
    branches:
      - prod
    paths:
      - "services/cv-service/**"
      - ".github/workflows/deploy-cv-service.yml"

concurrency:
  group: cv-service-prod-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and Deploy CV Service
    runs-on: ubuntu-latest
    environment: production

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ secrets.CV_SERVICE_ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ secrets.CV_SERVICE_ECS_CLUSTER }}
      ECS_SERVICE: ${{ secrets.CV_SERVICE_ECS_SERVICE }}
      CONTAINER_NAME: ${{ secrets.CV_SERVICE_CONTAINER_NAME }}
      TASK_DEFINITION_FILE: services/cv-service/ecs-task-definition.json
      DOCKERFILE_PATH: services/cv-service/Dockerfile
      BUILD_CONTEXT: services/cv-service

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e

          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          docker build \
            -f $DOCKERFILE_PATH \
            -t $IMAGE_URI \
            $BUILD_CONTEXT

          docker push $IMAGE_URI

          echo "image=$IMAGE_URI" >> $GITHUB_OUTPUT

      - name: Render ECS task definition
        id: render-task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.TASK_DEFINITION_FILE }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-def.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
